name: SVT historical audit

# Sweeps historical SVT articles that the 48h sitemap window can never reach,
# discovering URLs via the Brave Search API (trigger phrases, sliced by date)
# and fetching them live. Brave is paid per query: max_queries caps the spend
# of one run. discover_only runs the searches without fetching — the pilot
# mode, which also prints how many already-collected entries the searches
# surfaced (the recall signal). Long and
# resumable, like backfill_sitemap.yml: progress is saved as it goes, so a run
# that hits its time budget simply continues next time it is dispatched.
#
# Manual dispatch only. Yield is low by nature (corrections are rare), so this
# is run deliberately rather than on a schedule.

on:
  workflow_dispatch:
    inputs:
      year_from:
        description: 'Earliest archive year'
        required: false
        default: '2020'
      year_to:
        description: 'Latest archive year'
        required: false
        default: '2026'
      max_urls:
        description: 'Max live article fetches this run'
        required: false
        default: '500'
      max_queries:
        description: 'Max paid Brave requests this run'
        required: false
        default: '200'
      discover_only:
        description: 'Search only, fetch nothing (pilot / recall check)'
        type: boolean
        required: false
        default: false

concurrency:
  group: nrk-rettelser
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run historical audit
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          FROM="${{ github.event.inputs.year_from }}"
          TO="${{ github.event.inputs.year_to }}"
          MAX="${{ github.event.inputs.max_urls }}"
          QUERIES="${{ github.event.inputs.max_queries }}"
          EXTRA=""
          if [ "${{ github.event.inputs.discover_only }}" = "true" ]; then EXTRA="--discover-only"; fi
          python svt_audit.py --from "${FROM:-2020}" --to "${TO:-2026}" \
            --max-urls "${MAX:-500}" --max-queries "${QUERIES:-200}" \
            --max-minutes 240 $EXTRA

      # Commit before enriching or validating. New finds are `pending` in raw
      # and not yet in the frontend file, which the validator's cross-file
      # check rejects — validating here once discarded a whole run's finds.
      - name: Commit audit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "SVT historical audit"
          file_pattern: data/svt/corrections_raw.json data/svt/audit_progress.json

      - name: Run SVT enrichment + QA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python enrich_qa.py --outlet svt --max-entries 450

      - name: Commit SVT enriched data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "SVT enrichment + QA update"
          file_pattern: data/svt/corrections_raw.json data/svt/corrections.json

      - name: Validate data contract
        run: python validate_data.py --outlet svt
