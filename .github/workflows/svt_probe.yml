name: SVT Brave recall probe

# Exploratory and read-only: runs query variants against the Brave Search API
# and prints how many already-collected SVT entries each one surfaces. Commits
# nothing, so it does not join the nrk-rettelser concurrency group.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Comma-separated variant groups (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run probe
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GROUPS_INPUT: ${{ github.event.inputs.groups }}
        run: python svt_brave_probe.py --groups "$GROUPS_INPUT"
